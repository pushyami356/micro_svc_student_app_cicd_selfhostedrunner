apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: student-app
spec:
  selector: {app: gateway}
  ports:
    - {port: 80, targetPort: 80}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: student-app
spec:
  replicas: 1
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - {containerPort: 80}
          volumeMounts:
            - {name: nginx-config, mountPath: /etc/nginx/conf.d/default.conf, subPath: nginx.conf, readOnly: true}
          readinessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: 25m, memory: 48Mi}
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
