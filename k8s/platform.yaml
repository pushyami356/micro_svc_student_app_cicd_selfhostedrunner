apiVersion: v1
kind: Namespace
metadata:
  name: student-app
---
apiVersion: v1
kind: Service
metadata:
  name: database
  namespace: student-app
spec:
  selector: {app: database}
  ports:
    - {port: 3306, targetPort: 3306}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: database
  namespace: student-app
spec:
  serviceName: database
  replicas: 1
  selector:
    matchLabels: {app: database}
  template:
    metadata:
      labels: {app: database}
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - {containerPort: 3306}
          envFrom:
            - secretRef: {name: student-secrets}
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql}
            - {name: mysql-init, mountPath: /docker-entrypoint-initdb.d/init.sh, subPath: init.sh, readOnly: true}
          resources:
            requests: {cpu: 200m, memory: 512Mi}
      volumes:
        - name: mysql-init
          configMap:
            name: mysql-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: gp3
        resources:
          requests: {storage: 10Gi}
