
# Student Management Microservices
# Amazon EKS - Initial Monitoring Setup

grafana:
  enabled: true

  service:
    type: ClusterIP

  persistence:
    type: pvc
    enabled: true
    storageClassName: gp3
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    finalizers:
      - kubernetes.io/pvc-protection
prometheus:
  prometheusSpec:
    retention: 3d

    # Discover ServiceMonitors across namespaces
    serviceMonitorSelector:
      matchLabels: null

    serviceMonitorNamespaceSelector: {}

    resources:
      requests:
        cpu: 150m
        memory: 512Mi
      limits:
        memory: 2Gi

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

kube-state-metrics:
  enabled: true

prometheus-node-exporter:
  enabled: true

# EKS-managed control-plane components
kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

