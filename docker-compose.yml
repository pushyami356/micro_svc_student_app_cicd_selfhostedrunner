services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
      STUDENT_DB_PASSWORD: ${STUDENT_DB_PASSWORD:?set STUDENT_DB_PASSWORD in .env}
      ATTENDANCE_DB_PASSWORD: ${ATTENDANCE_DB_PASSWORD:?set ATTENDANCE_DB_PASSWORD in .env}
      MARKS_DB_PASSWORD: ${MARKS_DB_PASSWORD:?set MARKS_DB_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [internal]
  auth:
    build: {context: ., dockerfile: services/auth/Dockerfile}
    environment:
      DATABASE_URL: "mysql+pymysql://auth_user:${AUTH_DB_PASSWORD}@database:3306/auth_db"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?set DEMO_ADMIN_PASSWORD}
      DEMO_STUDENT_PASSWORD: ${DEMO_STUDENT_PASSWORD:?set DEMO_STUDENT_PASSWORD}
      PASSWORD_ENCRYPTION_KEY: ${PASSWORD_ENCRYPTION_KEY:?set PASSWORD_ENCRYPTION_KEY in .env}
    depends_on: {database: {condition: service_healthy}}
    networks: [internal]
  students:
    build: {context: ., dockerfile: services/students/Dockerfile}
    environment:
      DATABASE_URL: "mysql+pymysql://student_user:${STUDENT_DB_PASSWORD}@database:3306/student_db"
      JWT_SECRET: ${JWT_SECRET}
    depends_on: {database: {condition: service_healthy}}
    networks: [internal]
  attendance:
    build: {context: ., dockerfile: services/attendance/Dockerfile}
    environment:
      DATABASE_URL: "mysql+pymysql://attendance_user:${ATTENDANCE_DB_PASSWORD}@database:3306/attendance_db"
      JWT_SECRET: ${JWT_SECRET}
    depends_on: {database: {condition: service_healthy}}
    networks: [internal]
  marks:
    build: {context: ., dockerfile: services/marks/Dockerfile}
    environment:
      DATABASE_URL: "mysql+pymysql://marks_user:${MARKS_DB_PASSWORD}@database:3306/marks_db"
      JWT_SECRET: ${JWT_SECRET}
    depends_on: {database: {condition: service_healthy}}
    networks: [internal]
  frontend:
    build: ./frontend
    networks: [internal]
  gateway:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [frontend, auth, students, attendance, marks]
    networks: [internal]
networks:
  internal:
volumes:
  mysql_data:
