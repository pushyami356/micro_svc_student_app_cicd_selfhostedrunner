server {
    listen 80;
    client_max_body_size 1m;
    location /api/auth/ { proxy_pass http://auth:8000/; }
    location /api/students/ { proxy_pass http://students:8000/; }
    location /api/attendance/ { proxy_pass http://attendance:8000/; }
    location /api/marks/ { proxy_pass http://marks:8000/; }
    location / { proxy_pass http://frontend:80; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
}
